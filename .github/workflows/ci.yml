name: Site CI

on:
  pull_request:
  push:
    branches: [main, "redesign/**"]

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Verify preserved routes and Cisco curriculum
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/projects/index.html
          test -f dist/cisco/index.html
          grep -q 'Understand the network' dist/cisco/index.html
          test -f dist/cisco/learning/index.html
          grep -q 'All modules' dist/cisco/learning/index.html
          grep -q 'module-search' dist/cisco/learning/index.html
          test -f dist/cisco/labs/index.html
          test -f dist/cisco/reference/index.html
          test -f dist/reef/index.html
          test -f dist/CNAME

          lesson_dir="dist/cisco/learning/modules"
          lesson_count="$(find "$lesson_dir" -mindepth 2 -maxdepth 2 -name index.html | wc -l)"
          test "$lesson_count" -eq 30

          # Every published lesson must retain its completion control and quiz.
          for lesson in "$lesson_dir"/*/index.html; do
            grep -q 'data-completion="[0-9][0-9]"' "$lesson"
            grep -q 'data-lesson-quiz' "$lesson"
          done

          question_count="$(grep -roh 'class="quiz-question"' "$lesson_dir" | wc -l)"
          test "$question_count" -eq 95
