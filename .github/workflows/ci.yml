name: Site CI

on:
  pull_request:
  push:
    branches: [main, "redesign/**"]

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Verify preserved routes
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/projects/index.html
          test -f dist/cisco/index.html
          grep -q 'Understand the network' dist/cisco/index.html
          test -f dist/cisco/learning/index.html
          test -f dist/cisco/learning/index.html
          test -f dist/cisco/learning/modules/30-integrated-network-troubleshooting/index.html
          test -f dist/reef/index.html
          test -f dist/CNAME
